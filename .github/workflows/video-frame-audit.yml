name: Video frame audit

on:
  push:
    branches:
      - improve/video-storytelling-v4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[video-frame-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: improve/video-storytelling-v4
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download rendered video
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://thue-ro.vercel.app/api/videos/jobs/cef5e8d8-ad62-4efb-ad57-ecfc4fbfb2f7/video" \
            --output video.mp4
          test -s video.mp4
          ffprobe -v error -show_entries format=duration,size -of json video.mp4

      - name: Extract evenly spaced frames
        run: |
          rm -rf video-audit/tt94-v4
          mkdir -p video-audit/tt94-v4
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4)"
          INTERVAL="$(awk -v duration="$DURATION" 'BEGIN { printf "%.6f", duration / 12 }')"
          ffmpeg -hide_banner -loglevel error -i video.mp4 \
            -vf "fps=1/${INTERVAL},scale=540:-2" \
            -frames:v 12 -q:v 2 video-audit/tt94-v4/frame-%02d.jpg
          test "$(find video-audit/tt94-v4 -name 'frame-*.jpg' | wc -l)" -ge 10
          ffmpeg -hide_banner -loglevel error -framerate 1 \
            -i video-audit/tt94-v4/frame-%02d.jpg \
            -vf "tile=3x4:padding=8:margin=8" \
            -frames:v 1 -q:v 2 video-audit/tt94-v4/contact-sheet.jpg
          printf '%s\n' "$GITHUB_RUN_ID" > video-audit/tt94-v4/run-id.txt

      - name: Upload frame audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: tt94-v4-frame-audit
          path: video-audit/tt94-v4
          if-no-files-found: error
          retention-days: 7

      - name: Commit temporary audit frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-audit/tt94-v4
          git commit -m "Lưu khung hình audit video v4 [skip frame audit]"
          git push origin HEAD:improve/video-storytelling-v4
