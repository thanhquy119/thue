name: Video frame audit

on:
  push:
    branches:
      - improve/video-storytelling-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[video-frame-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download rendered video
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://thue-ro.vercel.app/api/videos/jobs/cef5e8d8-ad62-4efb-ad57-ecfc4fbfb2f7/video" \
            --output video.mp4
          test -s video.mp4
          ffprobe -v error -show_entries format=duration,size -of json video.mp4

      - name: Extract evenly spaced frames
        run: |
          mkdir -p frames
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4)"
          INTERVAL="$(awk -v duration="$DURATION" 'BEGIN { printf "%.6f", duration / 12 }')"
          ffmpeg -hide_banner -loglevel error -i video.mp4 \
            -vf "fps=1/${INTERVAL},scale=540:-2" \
            -frames:v 12 -q:v 2 frames/frame-%02d.jpg
          test "$(find frames -name 'frame-*.jpg' | wc -l)" -ge 10
          ffmpeg -hide_banner -loglevel error -framerate 1 \
            -i frames/frame-%02d.jpg \
            -vf "tile=3x4:padding=8:margin=8" \
            -frames:v 1 -q:v 2 frames/contact-sheet.jpg

      - name: Upload frame audit
        uses: actions/upload-artifact@v4
        with:
          name: tt94-v4-frame-audit
          path: frames
          if-no-files-found: error
          retention-days: 7
