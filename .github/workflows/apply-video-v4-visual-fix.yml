name: Apply video v4 visual fix

on:
  push:
    branches:
      - improve/video-storytelling-v4

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-video-v4-visual-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/video-storytelling-v4
          fetch-depth: 0

      - name: Patch visual item integrity and single-item layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(source: str, start: str, end: str, replacement: str) -> str:
              left = source.find(start)
              if left < 0:
                  raise SystemExit(f'Không tìm thấy marker đầu: {start}')
              right = source.find(end, left)
              if right < 0:
                  raise SystemExit(f'Không tìm thấy marker cuối: {end}')
              return source[:left] + replacement.rstrip() + '\n\n' + source[right:]

          path = Path('experiments/remotion-tt89/src/LegalVideo.tsx')
          source = path.read_text()

          source = replace_between(
              source,
              'function splitVisualText(',
              'function sceneVisualMode(',
              r'''function splitVisualText(value: string, maxChars = 128) {
            const normalized = value.replace(/\s+/gu, ' ').replace(/(?:…|\.{3,})$/u, '').trim();
            if (!normalized) return [];
            if (normalized.length <= maxChars) return [normalized];
            const clauses = normalized
              .split(/(?<=[;:.!?])\s+|\s+(?=(?:hoặc|đồng thời|nếu|khi|trường hợp|sau khi|trước khi)\b)/giu)
              .map((item) => item.replace(/^(?:hoặc|đồng thời)\s+/iu, '').trim())
              .filter(Boolean);
            const result: string[] = [];
            for (const clause of clauses.length ? clauses : [normalized]) {
              if (clause.length <= maxChars) {result.push(clause); continue;}
              const words = clause.split(/\s+/gu);
              let current = '';
              for (const word of words) {
                const candidate = [current, word].filter(Boolean).join(' ');
                if (current && candidate.length > maxChars) {result.push(current); current = word;} else current = candidate;
              }
              if (current) result.push(current);
            }
            return result.filter((item) => item.length >= 12 && !/[,;:]$/u.test(item));
          }
          function visualItems(scene: LegalVideoScene, limit = 3) {
            const source = scene.visualKeywords?.length ? scene.visualKeywords : scene.bullets;
            const unique: string[] = [];
            for (const raw of source) {
              const item = raw.replace(/\s+/gu, ' ').replace(/(?:…|\.{3,})$/u, '').trim();
              if (!item) continue;
              const key = item.toLocaleLowerCase('vi');
              if (!unique.some((existing) => existing.toLocaleLowerCase('vi') === key)) unique.push(item);
              if (unique.length >= limit) break;
            }
            return unique.length ? unique : splitVisualText(scene.narration).slice(0, limit);
          }''',
          )

          source = replace_between(
              source,
              'const ChecklistVisual =',
              'const DecisionVisual =',
              r'''const ChecklistVisual = ({scene}: {scene: LegalVideoScene}) => {
            const frame=useCurrentFrame(); const {fps}=useVideoConfig(); const items=visualItems(scene,3);
            if (items.length === 1) {
              const item = items[0];
              const appear = spring({frame: frame - 5, fps, config: {damping: 24, stiffness: 96}});
              const check = interpolate(frame, [18, 34], [0, 1], clamp);
              return <div style={{width:'100%',minHeight:560,padding:'54px 50px',borderRadius:52,backgroundColor:COLORS.mint,border:`3px solid ${COLORS.line}`,boxShadow:'0 28px 72px rgba(36,88,74,.12)',display:'grid',gridTemplateColumns:'250px 1fr',alignItems:'center',gap:42,opacity:appear,scale:interpolate(appear,[0,1],[.95,1],clamp)}}><div style={{width:230,height:230,borderRadius:72,backgroundColor:COLORS.card,border:`4px solid ${COLORS.green}`,display:'grid',placeItems:'center',boxShadow:'0 18px 48px rgba(36,88,74,.10)'}}><svg width="142" height="142" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M13 33 26 46 52 17" stroke={COLORS.green} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" pathLength="1" strokeDasharray="1" strokeDashoffset={1-check}/></svg></div><div><div style={{fontSize:22,fontWeight:920,letterSpacing:'.11em',color:COLORS.green,marginBottom:22}}>TRỌNG TÂM CẦN THỰC HIỆN</div><div style={{fontSize:item.length>112?36:item.length>82?40:46,lineHeight:1.2,fontWeight:900,color:COLORS.ink}}>{item}</div></div></div>;
            }
            return <div style={{width:'100%',display:'grid',gap:20}}>{items.map((item,index)=>{const appear=spring({frame:frame-7-index*10,fps,config:{damping:24,stiffness:100}}); const check=interpolate(frame,[16+index*10,28+index*10],[0,1],clamp); return <div key={item} style={{minHeight:item.length>112?202:172,padding:'27px 30px',borderRadius:38,backgroundColor:index===0?COLORS.mint:index===1?COLORS.cream:COLORS.sky,border:`2px solid ${COLORS.line}`,boxShadow:'0 17px 46px rgba(36,88,74,.08)',display:'grid',gridTemplateColumns:'116px 1fr',alignItems:'center',gap:24,opacity:appear,translate:`0 ${interpolate(appear,[0,1],[30,0],clamp)}px`}}><div style={{width:100,height:100,borderRadius:32,backgroundColor:COLORS.card,border:`3px solid ${COLORS.green}`,display:'grid',placeItems:'center'}}><svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M13 33 26 46 52 17" stroke={COLORS.green} strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" pathLength="1" strokeDasharray="1" strokeDashoffset={1-check}/></svg></div><div style={{fontSize:item.length>112?27:item.length>96?29:34,lineHeight:1.25,fontWeight:850,color:COLORS.ink}}>{item}</div></div>;})}</div>;
          };''',
          )

          source = replace_between(
              source,
              'const TakeawayVisual =',
              'function SceneVisual(',
              r'''const TakeawayVisual = ({scene}: {scene: LegalVideoScene}) => {
            const frame=useCurrentFrame(); const {fps}=useVideoConfig(); const items=visualItems(scene,3);
            return <div style={{width:'100%',display:'grid',gap:18}}>{items.map((item,index)=>{const appear=spring({frame:frame-8-index*11,fps,config:{damping:23,stiffness:100}}); return <div key={item} style={{minHeight:item.length>112?218:190,padding:'28px 30px',borderRadius:40,display:'grid',gridTemplateColumns:'110px 84px 1fr',alignItems:'center',gap:18,backgroundColor:index===0?COLORS.cream:index===1?COLORS.mint:COLORS.sky,border:`2px solid ${COLORS.line}`,boxShadow:'0 18px 48px rgba(36,88,74,.09)',opacity:appear,translate:`${interpolate(appear,[0,1],[index%2?45:-45,0],clamp)}px 0`}}><div style={{fontSize:66,lineHeight:1,fontWeight:950,color:index===0?COLORS.coral:COLORS.green,letterSpacing:'-.06em'}}>0{index+1}</div><KeywordGlyph text={item} size={76}/><div style={{fontSize:item.length>120?25:item.length>96?28:33,lineHeight:1.23,fontWeight:870,color:COLORS.ink}}>{item}</div></div>;})}</div>;
          };''',
          )
          path.write_text(source)

          storyboard = Path('lib/video/storyboard.ts')
          text = storyboard.read_text()
          text, count = text.replace('    if (scene.category === "effective") return [scene];\n', '', 1), text.count('    if (scene.category === "effective") return [scene];\n')
          if count != 1:
              raise SystemExit(f'Số nhánh effective tìm thấy không hợp lệ: {count}')
          storyboard.write_text(text)

          e2e = Path('scripts/run-video-v3-e2e.ts')
          text = e2e.read_text()
          anchor = '''    if (scene.kind !== "intro" && !(scene.visualKeywords?.length)) {
              throw new Error(`[video-v3-e2e] Cảnh ${scene.id} chưa có visualKeywords.`);
            }
          '''
          if anchor not in text:
              raise SystemExit('Không tìm thấy anchor visualKeywords trong E2E')
          addition = anchor + '''    for (const keyword of scene.visualKeywords ?? []) {
              if (incompleteDisplayText(keyword)) {
                throw new Error(`[video-v3-e2e] Visual keyword bị cắt hoặc dang dở: ${scene.id} — ${keyword}`);
              }
            }
          '''
          e2e.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Commit visual fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/remotion-tt89/src/LegalVideo.tsx lib/video/storyboard.ts scripts/run-video-v3-e2e.ts
          git commit -m "Sửa toàn vẹn card hình ảnh và bố cục cảnh một ý"
          git push origin HEAD:improve/video-storytelling-v4
