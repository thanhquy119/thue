name: Video v7 frame audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/video-v7-frame-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download rendered video
        run: |
          set -euo pipefail
          mkdir -p audit
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://thue-ro.vercel.app/api/videos/jobs/ccf1b505-8b9a-4d00-b9f8-95ab528c07dc/video" \
            --output audit/video.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 audit/video.mp4

      - name: Extract frames and contact sheet
        run: |
          set -euo pipefail
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 audit/video.mp4)"
          INTERVAL="$(awk -v duration="$DURATION" 'BEGIN { value=duration/16; if (value < 1) value=1; printf "%.3f", value }')"
          ffmpeg -hide_banner -loglevel error -i audit/video.mp4 \
            -vf "fps=1/${INTERVAL},scale=540:-2" -frames:v 16 audit/frame-%02d.jpg
          ffmpeg -hide_banner -loglevel error -i audit/video.mp4 \
            -vf "fps=1/${INTERVAL},scale=270:-2,tile=4x4:padding=8:margin=8:color=white" \
            -frames:v 1 audit/contact-sheet.jpg
          rm audit/video.mp4
          ls -lh audit

      - name: Upload audit frames
        uses: actions/upload-artifact@v4
        with:
          name: video-v7-frame-audit
          path: audit
          retention-days: 3
