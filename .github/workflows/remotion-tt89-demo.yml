name: Render Remotion Thong tu 89 demo

on:
  push:
    branches:
      - spike/remotion-tt89-demo
    paths:
      - experiments/remotion-tt89/**
      - .github/workflows/remotion-tt89-demo.yml
  pull_request:
    branches:
      - main
    paths:
      - experiments/remotion-tt89/**
      - .github/workflows/remotion-tt89-demo.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/remotion-tt89

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg fonts-dejavu-core

      - name: Generate Vietnamese voiceover
        run: |
          mkdir -p public/audio out
          espeak-ng -v vi -s 143 -a 185 -p 42 -w public/audio/scene-01.wav "Thông tư số tám mươi chín năm hai nghìn không trăm hai mươi sáu của Bộ Tài chính có điểm gì đáng chú ý?"
          espeak-ng -v vi -s 143 -a 185 -p 42 -w public/audio/scene-02.wav "Văn bản được ban hành ngày ba mươi tháng sáu năm hai nghìn không trăm hai mươi sáu, có hiệu lực từ ngày một tháng bảy cùng năm, để hướng dẫn Luật Quản lý thuế và Nghị định hai trăm năm mươi hai."
          espeak-ng -v vi -s 143 -a 185 -p 42 -w public/audio/scene-03.wav "Điểm mới nổi bật là lần đầu tiên quy định kiểm tra thuế bằng phương thức điện tử."
          espeak-ng -v vi -s 143 -a 185 -p 42 -w public/audio/scene-04.wav "Người nộp thuế có thể gửi hồ sơ, tài liệu, giải trình và trao đổi với cơ quan thuế trên môi trường số, giúp giảm đi lại, chi phí và tăng tính minh bạch."
          espeak-ng -v vi -s 143 -a 185 -p 42 -w public/audio/scene-05.wav "Để sẵn sàng, doanh nghiệp nên duy trì chữ ký số còn hiệu lực và lưu trữ hóa đơn, sổ sách, chứng từ điện tử có hệ thống. Video chỉ tóm tắt; khi áp dụng cần đối chiếu toàn văn chính thức."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -p tsconfig.json

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4
        run: npm run render -- --concurrency=2

      - name: Inspect output
        run: |
          ls -lh out
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/thong-tu-89-2026.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-thong-tu-89-demo
          path: experiments/remotion-tt89/out/thong-tu-89-2026.mp4
          if-no-files-found: error
          retention-days: 7
