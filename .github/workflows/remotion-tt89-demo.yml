name: Render Remotion Thong tu 89 demo

on:
  push:
    branches:
      - spike/remotion-tt89-demo
    paths:
      - experiments/remotion-tt89/**
      - .github/workflows/remotion-tt89-demo.yml
  pull_request:
    branches:
      - main
    paths:
      - experiments/remotion-tt89/**
      - .github/workflows/remotion-tt89-demo.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/remotion-tt89

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Vietnamese neural TTS
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.8

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate voiceover and timeline
        run: npm run assets

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4
        run: npm run render:only -- --concurrency=2

      - name: Inspect output
        run: |
          ls -lh out
          VIDEO_FILE="$(find out -maxdepth 1 -name '*.mp4' -print -quit)"
          test -n "$VIDEO_FILE"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO_FILE"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-legal-video-demo
          path: experiments/remotion-tt89/out/*.mp4
          if-no-files-found: error
          retention-days: 7
