name: Apply network two-card fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-network-two-cards.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prepare template v8 render
        run: |
          python - <<'PY'
          from pathlib import Path

          network_path = Path('experiments/remotion-tt89/src/LegalVideo.tsx')
          source = network_path.read_text(encoding='utf-8')
          start = source.index('const NetworkVisual')
          end = source.index('const FlowVisual', start)
          segment = source[start:end]
          segment = segment.replace('visualItems(scene, 3)', 'visualItems(scene, 2)', 1)
          segment = segment.replace('visualItems(scene,3)', 'visualItems(scene,2)', 1)
          network_path.write_text(source[:start] + segment + source[end:], encoding='utf-8')

          chunking = Path('lib/video/chunking.ts')
          text = chunking.read_text(encoding='utf-8')
          text = text.replace('VIDEO_TEMPLATE_VERSION = "legal-video-v7"', 'VIDEO_TEMPLATE_VERSION = "legal-video-v8"')
          chunking.write_text(text, encoding='utf-8')

          tests = Path('tests/video-template.test.ts')
          text = tests.read_text(encoding='utf-8')
          text = text.replace('VIDEO_TEMPLATE_VERSION = "legal-video-v7"', 'VIDEO_TEMPLATE_VERSION = "legal-video-v8"')
          text = text.replace('template và pipeline v7', 'template v8 và pipeline v7')
          tests.write_text(text, encoding='utf-8')

          smoke = Path('scripts/render-existing-video-smoke.ts')
          text = smoke.read_text(encoding='utf-8')
          text = text.replace(
              'b2561e56-9a88-4f5c-b441-e206768800c6',
              'ccf1b505-8b9a-4d00-b9f8-95ab528c07dc',
              1,
          )
          smoke.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and trigger render
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/remotion-tt89/src/LegalVideo.tsx lib/video/chunking.ts tests/video-template.test.ts scripts/render-existing-video-smoke.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Bản sửa đã được áp dụng."
            exit 0
          fi
          git commit -m "[video-render-existing-smoke] Render lại TT94 bằng template v8"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
